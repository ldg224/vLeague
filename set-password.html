<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Choose your password | vLeague</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0f19">
  <script>try{var d=JSON.parse(localStorage.getItem('vleague-device')||'{}');var th=d.theme||'dark';document.documentElement.dataset.theme=th==='light'||(th==='system'&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';if(d.text&&d.text!=='100')document.documentElement.style.fontSize=d.text+'%';if(d.motion==='reduce')document.documentElement.classList.add('reduce-motion')}catch(e){}</script>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/set-password.js"></script>
</head>
<body class="login">
  <svg class="pitch" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <line class="halfway" x1="-200" y1="500" x2="1200" y2="500" pathLength="1" />
    <circle class="ring" cx="500" cy="500" r="300" pathLength="1" />
  </svg>

  <main class="login-main">
    <h1 class="mark"><img src="assets/brand/crest.svg" alt=""><span>v<b>LEAGUE</b></span></h1>

    <p class="login-lead" id="checking" role="status">Checking your link…</p>

    <form id="choose" novalidate hidden>
      <h2 class="login-title" id="choose-title">Choose a new password</h2>
      <p class="login-lead" id="for"></p>
      <p class="msg error" id="error" role="alert" hidden></p>
      <!-- Lets password managers save the new password against the right account -->
      <input id="username" type="email" autocomplete="username" hidden>
      <div class="float pw">
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder=" " required>
        <label for="password">Password (8+ characters)</label>
        <button type="button" id="show" aria-controls="password confirm" aria-pressed="false">Show</button>
      </div>
      <div class="float">
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder=" " required>
        <label for="confirm">Confirm password</label>
      </div>
      <button class="btn" id="go" type="submit"><span class="spin" aria-hidden="true"></span><span class="label">Save password</span></button>
    </form>

    <div id="expired" class="login-state" hidden>
      <h2 class="login-title">This link has expired</h2>
      <a class="btn" href="index.html?reset">Get a new link</a>
    </div>
  </main>

  <footer class="login-foot"><a id="version" href="https://github.com/ldg224/vLeague/releases" target="_blank" rel="noopener"></a></footer>
</body>
</html>
