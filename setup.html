<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Set up your club | vLeague</title>
  <meta name="theme-color" content="#0a0f19">
  <script>try{var d=JSON.parse(localStorage.getItem('vleague-device')||'{}');var th=d.theme||'dark';document.documentElement.dataset.theme=th==='light'||(th==='system'&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';if(d.text&&d.text!=='100')document.documentElement.style.fontSize=d.text+'%';if(d.motion==='reduce')document.documentElement.classList.add('reduce-motion')}catch(e){}</script>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/member.css">
  <link rel="stylesheet" href="css/setup.css">
  <script type="module" src="js/setup.js"></script>
</head>
<body class="member setup">
  <div class="club-band on" id="band" aria-hidden="true"></div>
  <header class="member-top">
    <a class="brand" id="brand" href="home.html"><img src="assets/brand/crest.svg" alt=""><span>v<b>LEAGUE</b></span><em id="page-label">Set up your club</em></a>
    <a class="to-home" id="to-home" href="home.html" hidden>Home</a>
    <button class="account" id="signout" type="button">Sign out</button>
  </header>

  <main class="member-main su-main" id="main" aria-busy="true">
    <p class="quiet" id="loading">Loading…</p>

    <form id="form" novalidate hidden>
      <div class="su-head">
        <p class="su-kicker" id="kicker"></p>
        <h1 id="title">Set up your club</h1>
        <ol class="su-steps" id="steps" aria-label="Steps">
          <li data-go="1"><span>1</span>Club</li>
          <li data-go="2"><span>2</span>Colours</li>
          <li data-go="3"><span>3</span>Details</li>
        </ol>
      </div>

      <!-- 1: Club. In the edit view this card goes to the league office for approval. -->
      <section class="su-step" data-step="1" id="step-1" aria-labelledby="h1-club">
        <div class="su-step-head"><h2 id="h1-club">Club</h2></div>
        <div class="msg info" id="request-note" hidden></div>
        <div class="su-field">
          <label for="name">Club name</label>
          <input id="name" name="name" maxlength="25" autocomplete="off" required>
          <p class="su-hint"><span></span><span class="count" data-for="name"></span></p>
        </div>
        <div class="su-row">
          <div class="su-field">
            <label for="short_name">Short name <i>Optional</i></label>
            <input id="short_name" name="short_name" maxlength="12" autocomplete="off">
            <p class="su-hint"><span></span><span class="count" data-for="short_name"></span></p>
          </div>
          <div class="su-field su-code">
            <label for="code">Code</label>
            <div class="su-code-box">
              <input id="code" name="code" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" required readonly>
              <button type="button" class="su-link" id="code-change">Change</button>
            </div>
            <p class="su-hint"><span id="code-state"></span></p>
          </div>
        </div>
        <div class="su-field">
          <span class="su-label">Crest <i>Optional</i></span>
          <label class="su-drop" id="drop">
            <input type="file" id="crest" accept="image/png,image/jpeg,image/webp">
            <img id="crest-img" alt="" hidden>
            <span class="su-nocrest su-drop-badge" id="crest-badge"></span>
            <span class="su-drop-text"><b id="drop-title">Upload a crest</b><small>PNG or JPG</small></span>
          </label>
          <div class="msg error" id="crest-error" role="alert" hidden></div>
        </div>
        <div class="su-field" id="notes-field">
          <label for="notes">Note for the league office <i>Optional</i></label>
          <textarea id="notes" name="notes" maxlength="500" rows="2"></textarea>
          <p class="su-hint"><span></span><span class="count" data-for="notes"></span></p>
        </div>
        <div class="su-card-act" data-edit-only>
          <button class="btn" type="submit" value="identity"><span class="spin" aria-hidden="true"></span>Send to the office</button>
          <p class="su-msg" role="status"></p>
        </div>
      </section>

      <!-- 2: Colours -->
      <section class="su-step" data-step="2" aria-labelledby="h2-col">
        <div class="su-step-head"><h2 id="h2-col">Colours</h2></div>
        <div class="su-colours">
          <div class="su-field">
            <label for="colour">Main</label>
            <div class="su-swatch"><input type="color" id="colour-pick" aria-label="Pick the main colour"><input id="colour" name="colour" maxlength="7" spellcheck="false" autocomplete="off"></div>
          </div>
          <div class="su-field">
            <label for="colour2">Second</label>
            <div class="su-swatch"><input type="color" id="colour2-pick" aria-label="Pick the second colour"><input id="colour2" name="colour2" maxlength="7" spellcheck="false" autocomplete="off"></div>
          </div>
        </div>
        <p class="su-check" id="check" aria-live="polite"></p>
        <div class="su-preview" id="accent-preview"></div>
        <div class="su-card-act" data-edit-only>
          <button class="btn" type="submit" value="style"><span class="spin" aria-hidden="true"></span>Save</button>
          <p class="su-msg" role="status"></p>
        </div>
      </section>

      <!-- 3: Details -->
      <section class="su-step" data-step="3" aria-labelledby="h3-det">
        <div class="su-step-head"><h2 id="h3-det">Details</h2></div>
        <div class="su-field">
          <label for="manager_name">Manager name</label>
          <input id="manager_name" name="manager_name" maxlength="40" autocomplete="name">
          <p class="su-hint"><span></span><span class="count" data-for="manager_name"></span></p>
        </div>
        <div class="su-field">
          <label for="stadium">Stadium <i>Optional</i></label>
          <input id="stadium" name="stadium" maxlength="40" autocomplete="off">
          <p class="su-hint"><span></span><span class="count" data-for="stadium"></span></p>
        </div>
        <div class="su-field">
          <label for="motto">Motto <i>Optional</i></label>
          <input id="motto" name="motto" maxlength="80" autocomplete="off">
          <p class="su-hint"><span></span><span class="count" data-for="motto"></span></p>
        </div>
        <div class="su-card-act" data-edit-only>
          <button class="btn" type="submit" value="style"><span class="spin" aria-hidden="true"></span>Save</button>
          <p class="su-msg" role="status"></p>
        </div>
      </section>

      <div class="msg error" id="error" role="alert" hidden></div>
      <div class="su-nav" id="nav">
        <button class="btn ghost" type="button" id="back">Back</button>
        <button class="btn" type="submit" id="next" value="next"><span class="spin" aria-hidden="true"></span><span id="next-label">Continue</span></button>
      </div>
    </form>

    <div class="su-done" id="done" hidden>
      <img class="club-crest" id="done-crest" alt="">
      <h1 id="done-title">Sent to the league office</h1>
      <p class="quiet" id="done-text">Your colours are live. Your name and crest go live once the office approves them.</p>
      <a class="btn" href="home.html">Go to Home</a>
    </div>
  </main>
  <footer class="member-foot"><a class="to-editor" href="editor.html">Editor</a><a id="version" href="https://github.com/ldg224/vLeague/releases" target="_blank" rel="noopener"></a></footer>
</body>
</html>
