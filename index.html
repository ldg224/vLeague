<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign in | vLeague</title>
  <meta name="description" content="vLeague, virtual football. Sign in to manage your club.">
  <meta name="theme-color" content="#0a0f19">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="preload" as="image" href="assets/img/kick-night.jpg">
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/signin.js"></script>
</head>
<body>
  <div class="signin">
    <section class="showcase" aria-label="vLeague">
      <div class="photos" aria-hidden="true">
        <img class="on" src="assets/img/kick-night.jpg" alt="">
        <img src="assets/img/stadium-dusk.jpg" alt="" loading="lazy">
        <img src="assets/img/floodlights-turf.jpg" alt="" loading="lazy">
      </div>
      <a class="lockup" href="index.html"><img src="assets/brand/crest.svg" alt=""><span><b>vLEAGUE</b><small>VIRTUAL FOOTBALL</small></span></a>
      <p class="credit">Photos: <a href="https://unsplash.com/photos/cuhQcfp3By4" target="_blank" rel="noopener">Jannes Glas</a>, <a href="https://unsplash.com/photos/0oMsWA8yLN0" target="_blank" rel="noopener">Pascal Müller</a> and <a href="https://unsplash.com/photos/NGVZJPD3UVw" target="_blank" rel="noopener">Sudhanshu Walzade</a> on Unsplash</p>
    </section>

    <main class="panel">
      <div class="card">
        <div class="card-head">
          <img src="assets/brand/crest.svg" alt="">
          <h2>Sign in</h2>
          <p>Managers and the league office.</p>
        </div>
        <form id="signin" novalidate>
          <p class="msg error" id="error" role="alert" hidden></p>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
              <button type="button" id="show" aria-controls="password" aria-pressed="false">Show</button>
            </div>
          </div>
          <div class="row">
            <label class="check"><input id="remember" type="checkbox" checked> Keep me signed in</label>
          </div>
          <button class="btn" id="go" type="submit"><span class="spin" aria-hidden="true"></span><span class="label">Sign in</span></button>
          <p class="msg info" id="setup" hidden></p>
        </form>
        <p class="note">Accounts are made by the league office. Forgotten your password or need an account? Ask the league office.</p>
      </div>
    </main>
  </div>
</body>
</html>
