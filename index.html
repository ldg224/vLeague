<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign in | vLeague</title>
  <meta name="description" content="vLeague, virtual football. Sign in to manage your club, or view as a guest to watch matches, results and league news.">
  <meta name="theme-color" content="#0a0f19">
  <script>try{var d=JSON.parse(localStorage.getItem('vleague-device')||'{}');if(d.text&&d.text!=='100')document.documentElement.style.fontSize=d.text+'%';if(d.motion==='reduce')document.documentElement.classList.add('reduce-motion')}catch(e){}</script>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/signin.js"></script>
</head>
<body class="login">
  <!-- The pitch's centre circle and halfway line, drawn once behind the form -->
  <svg class="pitch" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <line class="halfway" x1="-200" y1="500" x2="1200" y2="500" pathLength="1" />
    <circle class="ring" cx="500" cy="500" r="300" pathLength="1" />
  </svg>

  <main class="login-main">
    <h1 class="mark"><img src="assets/brand/crest.svg" alt=""><span>v<b>LEAGUE</b></span><span class="sr-only">: sign in</span></h1>

    <form id="signin" novalidate>
      <p class="msg error" id="error" role="alert" hidden></p>
      <div class="float">
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" placeholder=" " required>
        <label for="email">Email</label>
      </div>
      <div class="float pw">
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder=" " required>
        <label for="password">Password</label>
        <button type="button" id="show" aria-controls="password" aria-pressed="false">Show</button>
      </div>
      <div class="login-row">
        <label class="check"><input id="remember" type="checkbox" checked> Keep me signed in</label>
        <button type="button" class="quiet" id="forgot">Forgot password?</button>
      </div>
      <button class="btn" id="go" type="submit"><span class="spin" aria-hidden="true"></span><span class="label">Sign in</span></button>
      <p class="msg info" id="setup" hidden></p>
    </form>

    <form id="reset" novalidate hidden>
      <p class="login-lead">Enter your email and we’ll send you a link to choose a new password.</p>
      <p class="msg error" id="reset-error" role="alert" hidden></p>
      <p class="msg info" id="reset-sent" role="status" hidden>If that email has an account, we’ve sent a link. It can take a minute to arrive.</p>
      <div class="float">
        <input id="reset-email" name="email" type="email" autocomplete="username" inputmode="email" placeholder=" " required>
        <label for="reset-email">Email</label>
      </div>
      <button class="btn" id="reset-go" type="submit"><span class="spin" aria-hidden="true"></span><span class="label">Send link</span></button>
      <button type="button" class="quiet back" id="reset-back">Back to sign in</button>
    </form>

    <a class="btn ghost guest-btn" id="guest" href="dashboard.html">View as guest</a>
  </main>

  <footer class="login-foot"><a id="version" href="https://github.com/ldg224/vLeague/releases" target="_blank" rel="noopener"></a></footer>
</body>
</html>
