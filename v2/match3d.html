<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vLeague V2-1: 3D match test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; color: #fff; font-family: Archivo, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .bug { position: fixed; top: 16px; left: 16px; display: flex; align-items: stretch; border-radius: 8px; overflow: hidden; font-weight: 700; font-size: 15px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .bug span { padding: 7px 12px; display: flex; align-items: center; gap: 8px; }
  .bug .tm { background: rgba(10, 20, 45, .88); }
  .bug .sc { background: #fff; color: #0b1a3a; font-stretch: 125%; font-weight: 900; letter-spacing: .02em; }
  .bug .ck { background: #1e88e5; font-variant-numeric: tabular-nums; }
  .bug i { width: 4px; align-self: stretch; margin: -7px 0 -7px -12px; }
  .ctl { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; background: rgba(10, 20, 45, .82); padding: 6px; border-radius: 999px; font-size: 13px; }
  .ctl button { height: 34px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .ctl button[aria-pressed="true"] { background: #fff; color: #0b1a3a; }
  .ctl input { width: 160px; }
  .fps { position: fixed; top: 16px; right: 16px; font-size: 12px; background: rgba(0,0,0,.5); padding: 5px 9px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .tag { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 900; font-stretch: 125%; letter-spacing: .08em; background: #1e88e5; padding: 5px 12px; border-radius: 6px; display: none; }
  .cap { position: fixed; left: 16px; bottom: 70px; font-size: 13px; font-weight: 700; background: rgba(10,20,45,.85); padding: 6px 10px; border-radius: 6px; display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="bug"><span class="tm" id="bug-h"></span><span class="sc" id="bug-s">0–0</span><span class="tm" id="bug-a"></span><span class="ck" id="bug-c">00:00</span></div>
<div class="fps" id="fps"></div>
<div class="cap" id="cap"></div>
<div class="tag" id="tag"></div>
<div class="ctl">
  <button id="play">Pause</button>
  <button data-sp="1" aria-pressed="true">1×</button><button data-sp="2">2×</button><button data-sp="4">4×</button>
  <button id="goal">Next goal</button>
  <input id="seek" type="range" min="0" max="1" step="0.0001" aria-label="Match time">
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module" src="match3d.js"></script>
</body>
</html>
