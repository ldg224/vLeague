const keys = (new URLSearchParams(location.search).get('k') || ['classic', ...Object.keys(PRESETS)].join(',')).split(',');

for (const k of keys) {
  const cv = document.createElement('canvas'); cv.width = 700; cv.height = 190; document.getElementById('out').append(cv);
  const c = cv.getContext('2d'), r = Object.create(HighlightsRenderer.prototype);
  Object.assign(r, { c, A: { league: null, logos: {} }, fx: { week: 12, look: k }, season: { looks: {}, rounds: { 12: { label: 'Round 12', name: 'Opening Week', numbered: true, no: 12 } } },

}
